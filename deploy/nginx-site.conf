server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAME__;

    root __WEBROOT__;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA: cualquier ruta desconocida vuelve al index
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre -> cache inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # El index no se cachea (para que un deploy nuevo se vea al instante)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    access_log /var/log/nginx/crochet-letters.access.log;
    error_log  /var/log/nginx/crochet-letters.error.log;
}
